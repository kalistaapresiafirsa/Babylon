<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visualisasi 3D Kristal dengan Babylon.js</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 18px;
            border-radius: 24px;
            font-size: 14px;
            pointer-events: none;
            z-index: 10;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        #info i {
            font-style: normal;
            display: inline-block;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }
    </style>
</head>
<body>
    <div id="info">✨ Kristal 3D • Babylon.js</div>

    <!-- Babylon.js dan dependensi di-load dari CDN -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>

    <script>
        // --- 1. Setup dasar: engine, scene, camera, light ---
        const canvas = document.createElement('canvas');
        document.body.appendChild(canvas);
        canvas.style.width = '100%';
        canvas.style.height = '100%';
        canvas.style.display = 'block';

        const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
        const scene = new BABYLON.Scene(engine);
        scene.clearColor = new BABYLON.Color4(0.05, 0.05, 0.12, 1.0); // warna latar gelap kebiruan

        // Kamera: ArcRotate untuk orbit interaktif
        const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 3, Math.PI / 3.5, 8, BABYLON.Vector3.Zero(), scene);
        camera.attachControl(canvas, true);
        camera.wheelPrecision = 0.3;
        camera.minZ = 0.1;
        camera.maxZ = 30;
        camera.upperRadiusLimit = 15;
        camera.lowerRadiusLimit = 3;

        // Pencahayaan: ambient + directional + titik untuk efek berkilau
        const ambientLight = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
        ambientLight.intensity = 0.5;
        ambientLight.groundColor = new BABYLON.Color3(0.2, 0.3, 0.4);

        const dirLight = new BABYLON.DirectionalLight("dir", new BABYLON.Vector3(-1, -1, 1), scene);
        dirLight.intensity = 1.2;
        dirLight.position = new BABYLON.Vector3(2, 5, 4);

        const backLight = new BABYLON.DirectionalLight("back", new BABYLON.Vector3(1, 0.5, -1), scene);
        backLight.intensity = 0.6;

        // Titik light untuk pantulan spesifik
        const pointLight = new BABYLON.PointLight("point", new BABYLON.Vector3(1, 2, 3), scene);
        pointLight.intensity = 0.8;

        // --- 2. Membuat struktur Kristal (gabungan beberapa bentuk) ---

        // Fungsi bantu untuk membuat "atom" bola kecil dengan material glossy
        function createAtom(position, color, size = 0.25, emissive = false) {
            const sphere = BABYLON.MeshBuilder.CreateSphere("sphere", { diameter: size }, scene);
            sphere.position = position;
            
            const material = new BABYLON.StandardMaterial("mat", scene);
            material.diffuseColor = color;
            material.specularColor = new BABYLON.Color3(0.8, 0.8, 0.9);
            material.specularPower = 64;
            if (emissive) {
                material.emissiveColor = color.scale(0.3);
            }
            sphere.material = material;
            return sphere;
        }

        // Fungsi untuk membuat "batang" silinder yang menghubungkan dua titik
        function createBond(posFrom, posTo, color, radius = 0.04) {
            const from = new BABYLON.Vector3(posFrom.x, posFrom.y, posFrom.z);
            const to = new BABYLON.Vector3(posTo.x, posTo.y, posTo.z);
            const direction = to.subtract(from);
            const length = direction.length();
            const mid = from.add(direction.scale(0.5));

            const cylinder = BABYLON.MeshBuilder.CreateCylinder("cylinder", { height: length, diameter: radius * 2 }, scene);
            cylinder.position = mid;
            cylinder.rotationQuaternion = BABYLON.Quaternion.FromUnitVectors(
                new BABYLON.Vector3(0, 1, 0),
                direction.normalize()
            );

            const material = new BABYLON.StandardMaterial("matBond", scene);
            material.diffuseColor = color;
            material.specularColor = new BABYLON.Color3(0.5, 0.5, 0.5);
            material.specularPower = 32;
            cylinder.material = material;
            return cylinder;
        }

        // --- 3. Membangun struktur kristal (kombinasi kubus + oktahedron) ---

        // Warna-warna utama untuk atom
        const colorCentral = new BABYLON.Color3(0.9, 0.3, 0.5);  // merah muda
        const colorCorner = new BABYLON.Color3(0.2, 0.8, 0.9);   // cyan
        const colorEdge = new BABYLON.Color3(0.9, 0.8, 0.1);     // emas
        const colorBond = new BABYLON.Color3(0.7, 0.7, 0.9);     // putih kebiruan

        // Koordinat untuk kubus sederhana (8 titik) dengan skala 1.2
        const s = 1.2;
        const corners = [
            new BABYLON.Vector3(-s, -s, -s),
            new BABYLON.Vector3( s, -s, -s),
            new BABYLON.Vector3( s, -s,  s),
            new BABYLON.Vector3(-s, -s,  s),
            new BABYLON.Vector3(-s,  s, -s),
            new BABYLON.Vector3( s,  s, -s),
            new BABYLON.Vector3( s,  s,  s),
            new BABYLON.Vector3(-s,  s,  s)
        ];

        // Tambahkan atom di sudut-sudut kubus
        corners.forEach(pos => {
            createAtom(pos, colorCorner, 0.3, false);
        });

        // Tambahkan atom di tepi-tepi (midpoint dari tiap rusuk) 
        // untuk memberikan efek kristal yang lebih kompleks
        const edgePairs = [
            [0,1], [1,2], [2,3], [3,0],
            [4,5], [5,6], [6,7], [7,4],
            [0,4], [1,5], [2,6], [3,7]
        ];
        edgePairs.forEach(pair => {
            const mid = corners[pair[0]].add(corners[pair[1]]).scale(0.5);
            createAtom(mid, colorEdge, 0.2, true);
        });

        // Atom pusat (lebih besar)
        const centerPos = BABYLON.Vector3.Zero();
        createAtom(centerPos, colorCentral, 0.5, true);

        // --- 4. Menambahkan "ikatan" (bond) antara atom pusat dan sudut ---
        corners.forEach(pos => {
            createBond(centerPos, pos, colorBond, 0.06);
        });

        // --- 5. Menambahkan elemen dekoratif: beberapa "oktahedron" kecil melayang di sekitar ---
        // Ini memberi kesan kristal yang lebih kaya
        const octaPositions = [
            new BABYLON.Vector3(2.2, 0.8, 1.5),
            new BABYLON.Vector3(-1.8, 1.6, -1.8),
            new BABYLON.Vector3(1.2, -1.9, 1.9),
            new BABYLON.Vector3(-2.0, -1.2, -1.5),
            new BABYLON.Vector3(0.0, 2.5, -1.2),
            new BABYLON.Vector3(0.0, -2.3, 1.8)
        ];

        octaPositions.forEach((pos, index) => {
            // Buat oktahedron dengan ukuran bervariasi
            const size = 0.25 + Math.random() * 0.25;
            const octa = BABYLON.MeshBuilder.CreatePolyhedron("octa", {
                type: 1, // 1 = oktahedron
                size: size,
                custom: null
            }, scene);
            octa.position = pos;
            
            // Rotasi acak
            octa.rotation.x = Math.random() * Math.PI;
            octa.rotation.y = Math.random() * Math.PI;
            octa.rotation.z = Math.random() * Math.PI;

            // Material transparan berwarna
            const mat = new BABYLON.StandardMaterial("octaMat", scene);
            const hue = (index / octaPositions.length) * 0.8 + 0.2;
            mat.diffuseColor = new BABYLON.Color3(0.3 + hue * 0.5, 0.2 + (1 - hue) * 0.6, 0.8);
            mat.alpha = 0.35;
            mat.specularColor = new BABYLON.Color3(0.6, 0.6, 0.8);
            mat.specularPower = 32;
            octa.material = mat;
        });

        // --- 6. Efek partikel kecil (seperti debu kristal) di sekitar ---
        const particleSystem = new BABYLON.ParticleSystem("particles", 300, scene);
        particleSystem.particleTexture = new BABYLON.Texture("https://playground.babylonjs.com/textures/flare.png", scene);
        particleSystem.emitter = new BABYLON.Vector3(0, 0, 0);
        particleSystem.minEmitBox = new BABYLON.Vector3(-3.5, -3.5, -3.5);
        particleSystem.maxEmitBox = new BABYLON.Vector3(3.5, 3.5, 3.5);
        particleSystem.color1 = new BABYLON.Color4(0.7, 0.8, 1.0, 0.6);
        particleSystem.color2 = new BABYLON.Color4(0.2, 0.5, 1.0, 0.2);
        particleSystem.colorDead = new BABYLON.Color4(0.0, 0.0, 0.0, 0.0);
        particleSystem.minSize = 0.02;
        particleSystem.maxSize = 0.08;
        particleSystem.minLifeTime = 0.8;
        particleSystem.maxLifeTime = 2.5;
        particleSystem.emitRate = 25;
        particleSystem.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
        particleSystem.gravity = new BABYLON.Vector3(0, 0.02, 0);
        particleSystem.direction1 = new BABYLON.Vector3(-0.5, -0.5, -0.5);
        particleSystem.direction2 = new BABYLON.Vector3(0.5, 0.5, 0.5);
        particleSystem.start();

        // --- 7. Animasi rotasi kelompok kristal (keseluruhan) ---
        // Kita kelompokkan semua mesh yang merupakan bagian dari struktur utama 
        // (atom, bond, dan oktahedron dekoratif) dalam satu grup, 
        // tapi kita rotasi per mesh agar lebih fleksibel.
        // Atau kita buat grup root kosong.
        const rootGroup = new BABYLON.TransformNode("root");
        // Pindahkan semua mesh (kecuali partikel, lampu, kamera) ke dalam rootGroup
        scene.meshes.forEach(mesh => {
            // Jangan pindahkan partikel sistem (bukan mesh) atau mesh yang tidak terkait
            if (mesh !== particleSystem && mesh.parent === null && mesh !== scene.getMeshByName("sphere") && mesh !== scene.getMeshByName("cylinder")) {
                // Pindahkan hanya mesh yang kita buat (atom, bond, octa) 
                // dengan mengecek apakah mesh memiliki material (agar tidak memindahkan kamera atau light)
                if (mesh.material) {
                    mesh.parent = rootGroup;
                }
            }
        });
        // Namun beberapa mesh mungkin tidak memiliki material (misalnya cylinder bond), tapi kita sudah atur material
        // Jadi semua atom, bond, octa akan menjadi anak rootGroup.
        // Tapi partikel tidak termasuk mesh, jadi aman.

        // Animasi: rootGroup berputar perlahan
        let angle = 0;
        const rotationSpeed = 0.004;

        // --- 8. Loop render ---
        engine.runRenderLoop(() => {
            // Rotasi rootGroup
            angle += rotationSpeed;
            rootGroup.rotation.y = angle;
            rootGroup.rotation.x = Math.sin(angle * 0.5) * 0.05;
            rootGroup.rotation.z = Math.cos(angle * 0.3) * 0.03;

            scene.render();
        });

        // Resize handler
        window.addEventListener('resize', () => {
            engine.resize();
        });

        // Tambahan: sedikit petunjuk di konsol
        console.log('Visualisasi Kristal 3D dengan Babylon.js siap!');
        console.log('Gunakan mouse untuk memutar, scroll untuk zoom.');
    </script>
</body>
</html>
